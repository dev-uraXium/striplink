# Render Blueprint — one free Docker web service + one free Key Value (Redis).
# Postgres lives on Neon (Render free Postgres expires after 30 days). Public traffic comes in via cloudflare/worker.js.
# Deploy: Render dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: striplink
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      ignoredPaths:
        - cloudflare/**
        - README.md
        - '*.md'
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 9900
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: striplink-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: IP_HASH_SECRET
        generateValue: true
      - key: CHART_SUBJECT_SECRET
        generateValue: true
      - key: DB_ENCRYPTION_KEY
        generateValue: true
      - key: PROXY_SECRET # copy this value to the Cloudflare Worker's PROXY_SECRET
        generateValue: true
      # Fill these in on the Render dashboard when the Blueprint asks:
      - key: FRONTEND_URL # public URL = the Cloudflare Worker
        value: https://striplink.dev-uraxium.workers.dev
      - key: PUBLIC_API_URL # used for the Google Forms webhook URL
        value: https://striplink.dev-uraxium.workers.dev
      - key: POSTGRES_DB_URL # Neon → Connect → pooled connection string
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        value: https://striplink.dev-uraxium.workers.dev/api/auth/discord/callback
      - key: ADMIN_IDS # your Discord user id(s), comma separated
        sync: false

  - type: keyvalue
    name: striplink-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # internal connections only

version: "3.8"

services:
  striplink:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9900:9900"
    environment:
      - NODE_ENV=production
      - DEPLOYMENT=production
    env_file:
      - .env.production
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - striplink-network

networks:
  striplink-network:
    driver: bridge
